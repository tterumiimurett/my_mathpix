<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyMathpix Ticket 01 Safe Fixture</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1020; color: #111827; }
    body { display: grid; place-items: center; font-family: -apple-system, sans-serif; }
    .guard { padding: 64px; background: #f43f5e; border-radius: 24px; }
    .target {
      position: relative;
      width: 620px;
      padding: 36px;
      background: repeating-linear-gradient(135deg, #d1fae5 0 16px, #ecfccb 16px 32px);
      border: 12px solid #22c55e;
    }
    .marker { position: absolute; width: 22px; height: 22px; }
    .marker-a { top: 10px; left: 10px; background: #06b6d4; }
    .marker-b { top: 10px; right: 10px; background: #a855f7; }
    .marker-c { bottom: 10px; left: 10px; background: #f59e0b; }
    .marker-d { bottom: 10px; right: 10px; background: #3b82f6; }
    .formula { font: 44px Georgia, serif; text-align: center; margin-bottom: 26px; }
    table { border-collapse: collapse; width: 100%; font-size: 24px; }
    th, td { border: 3px solid #111827; padding: 10px 14px; text-align: center; }
    .label { margin-top: 22px; text-align: center; font-weight: 700; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div class="guard">
    <div class="target">
      <span class="marker marker-a"></span><span class="marker marker-b"></span>
      <span class="marker marker-c"></span><span class="marker marker-d"></span>
      <div class="formula">x² + y² = z²</div>
      <table><tr><th>a</th><th>b</th></tr><tr><td>1</td><td>2</td></tr></table>
      <div class="label">TICKET 01 SAFE FIXTURE</div>
    </div>
  </div>
</body>
</html>
